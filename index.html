<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4CAF50">

<title>Jeu du Quotient et du Reste</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
    min-height: 100vh;
}

.app {
    max-width: 500px;
    margin: auto;
    padding: 15px;
    text-align: center;
}

h1 {
    font-size: 28px;
    color: #2e7d32;
    margin: 10px 0;
}

.subtitle {
    font-size: 19px;
    color: #555;
    margin-bottom: 15px;
}

.score {
    background: white;
    border-radius: 20px;
    padding: 12px;
    font-size: 22px;
    font-weight: bold;
    box-shadow: 0 3px 10px #ccc;
}

.stars {
    font-size: 30px;
    margin: 8px;
}

.card {
    background: white;
    border-radius: 25px;
    padding: 22px 15px;
    margin-top: 15px;
    box-shadow: 0 5px 15px #ccc;
}

.question-number {
    font-size: 18px;
    color: #777;
}

.question {
    font-size: 44px;
    font-weight: bold;
    margin: 20px 0;
    color: #1565c0;
}

.help {
    font-size: 19px;
    background: #fff8e1;
    border-radius: 15px;
    padding: 12px;
    margin-bottom: 18px;
}

.answers {
    display: flex;
    gap: 12px;
    justify-content: center;
}

.box {
    width: 45%;
}

.box label {
    display: block;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 7px;
}

input {
    width: 100%;
    height: 65px;
    border: 3px solid #90caf9;
    border-radius: 15px;
    font-size: 30px;
    text-align: center;
    outline: none;
}

input:focus {
    border-color: #2196f3;
}

button {
    width: 90%;
    max-width: 350px;
    border: none;
    border-radius: 18px;
    padding: 16px;
    margin: 10px auto;
    font-size: 22px;
    font-weight: bold;
    display: block;
    cursor: pointer;
}

#check {
    background: #4caf50;
    color: white;
}

#next {
    background: #2196f3;
    color: white;
    display: none;
}

#restart {
    background: #ff9800;
    color: white;
}

.message {
    min-height: 40px;
    font-size: 22px;
    font-weight: bold;
    margin: 12px;
}

.good {
    color: #2e7d32;
}

.bad {
    color: #d32f2f;
}

.explanation {
    font-size: 19px;
    line-height: 1.5;
}

.finished {
    display: none;
    background: white;
    border-radius: 25px;
    padding: 30px 15px;
    margin-top: 20px;
    box-shadow: 0 5px 15px #ccc;
}

.finished h2 {
    font-size: 30px;
    color: #2e7d32;
}

.final-score {
    font-size: 26px;
    font-weight: bold;
}

@media (max-width: 380px) {
    h1 {
        font-size: 24px;
    }

    .question {
        font-size: 38px;
    }

    input {
        height: 58px;
        font-size: 26px;
    }
}
</style>
</head>

<body>

<div class="app">

    <h1>🧮 Le jeu du reste</h1>

    <div class="subtitle">
        Trouve le quotient et le reste !
    </div>

    <div class="score">
        ⭐ Score : <span id="score">0</span> / 10
    </div>

    <div class="stars" id="stars">
        ☆ ☆ ☆ ☆ ☆
    </div>

    <div class="card" id="game">

        <div class="question-number">
            Question <span id="questionNumber">1</span> / 10
        </div>

        <div class="question">
            <span id="dividend">22</span>
            ÷
            <span id="divisor">6</span>
        </div>

        <div class="help">
            🤔 Combien de fois peut-on mettre
            <b id="helpDivisor">6</b>
            dans
            <b id="helpDividend">22</b> ?
        </div>

        <div class="answers">

            <div class="box">
                <label>🔢 Quotient</label>
                <input
                    id="quotient"
                    type="number"
                    inputmode="numeric"
                    min="0"
                    placeholder="?"
                >
            </div>

            <div class="box">
                <label>🔵 Reste</label>
                <input
                    id="remainder"
                    type="number"
                    inputmode="numeric"
                    min="0"
                    placeholder="?"
                >
            </div>

        </div>

        <div id="message" class="message"></div>

        <div id="explanation" class="explanation"></div>

        <button id="check" onclick="checkAnswer()">
            ✅ Vérifier
        </button>

        <button id="next" onclick="nextQuestion()">
            👉 Question suivante
        </button>

    </div>

    <div class="finished" id="finished">

        <h2>🎉 Bravo ! 🎉</h2>

        <div class="final-score">
            Ton score :
            <span id="finalScore">0</span> / 10
        </div>

        <div id="finalStars" class="stars"></div>

        <button id="restart" onclick="restartGame()">
            🔄 Rejouer
        </button>

    </div>

</div>

<script>

let dividend;
let divisor;

let score = 0;
let questionNumber = 1;
let answered = false;

const TOTAL_QUESTIONS = 10;


// -----------------------------
// Nouvelle question
// -----------------------------

function newQuestion() {

    // Diviseur entre 2 et 9
    divisor = Math.floor(Math.random() * 8) + 2;

    // Pour commencer, nombres entre 10 et 50
    dividend = Math.floor(Math.random() * 41) + 10;

    document.getElementById("dividend").textContent = dividend;
    document.getElementById("divisor").textContent = divisor;

    document.getElementById("helpDividend").textContent = dividend;
    document.getElementById("helpDivisor").textContent = divisor;

    document.getElementById("questionNumber").textContent =
        questionNumber;

    document.getElementById("quotient").value = "";
    document.getElementById("remainder").value = "";

    document.getElementById("message").textContent = "";
    document.getElementById("message").className = "message";

    document.getElementById("explanation").textContent = "";

    document.getElementById("check").style.display = "block";
    document.getElementById("next").style.display = "none";

    answered = false;

    document.getElementById("quotient").focus();

    updateStars();
}


// -----------------------------
// Vérifier
// -----------------------------

function checkAnswer() {

    if (answered) return;

    const q = Number(
        document.getElementById("quotient").value
    );

    const r = Number(
        document.getElementById("remainder").value
    );

    const correctQ = Math.floor(dividend / divisor);
    const correctR = dividend % divisor;

    const message =
        document.getElementById("message");

    const explanation =
        document.getElementById("explanation");


    if (q === correctQ && r === correctR) {

        score++;

        document.getElementById("score").textContent = score;

        message.textContent = "🎉 BRAVO ! C'est juste !";
        message.className = "message good";

        explanation.innerHTML =
            `👏 ${dividend} = ${divisor} × ${correctQ} + ${correctR}`;

    } else {

        message.textContent = "😊 Essaie encore la prochaine fois !";
        message.className = "message bad";

        explanation.innerHTML =
            `La réponse était :<br>
             🔢 Quotient = <b>${correctQ}</b><br>
             🔵 Reste = <b>${correctR}</b><br><br>
             ${dividend} = ${divisor} × ${correctQ} + ${correctR}`;
    }

    answered = true;

    document.getElementById("check").style.display = "none";

    if (questionNumber < TOTAL_QUESTIONS) {
        document.getElementById("next").style.display = "block";
    } else {
        setTimeout(showResult, 700);
    }

    updateStars();
}


// -----------------------------
// Question suivante
// -----------------------------

function nextQuestion() {

    questionNumber++;

    newQuestion();
}


// -----------------------------
// Étoiles
// -----------------------------

function updateStars() {

    let stars = "";

    for (let i = 0; i < 5; i++) {

        if (i < Math.min(score, 5)) {
            stars += "⭐ ";
        } else {
            stars += "☆ ";
        }
    }

    document.getElementById("stars").textContent = stars;
}


// -----------------------------
// Résultat final
// -----------------------------

function showResult() {

    document.getElementById("game").style.display = "none";

    document.getElementById("finished").style.display = "block";

    document.getElementById("finalScore").textContent = score;

    let finalStars = "";

    if (score === 10) {
        finalStars = "⭐⭐⭐⭐⭐<br>🏆 Champion !";
    }
    else if (score >= 7) {
        finalStars = "⭐⭐⭐⭐<br>🌟 Super !";
    }
    else if (score >= 5) {
        finalStars = "⭐⭐⭐<br>👏 Bravo !";
    }
    else {
        finalStars = "⭐⭐<br>💪 Continue à t'entraîner !";
    }

    document.getElementById("finalStars").innerHTML =
        finalStars;
}


// -----------------------------
// Recommencer
// -----------------------------

function restartGame() {

    score = 0;
    questionNumber = 1;

    document.getElementById("score").textContent = "0";

    document.getElementById("game").style.display = "block";

    document.getElementById("finished").style.display = "none";

    newQuestion();
}


// Lancer le jeu
newQuestion();

</script>

</body>
</html>
