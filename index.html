<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4CAF50">

<title>Division : Quotient et Reste</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #222;
}

header {
    background: #4CAF50;
    color: white;
    text-align: center;
    padding: 18px 10px;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    margin-top: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
    margin-top: 0;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 18px;
    font-size: 16px;
    cursor: pointer;
}

.menu button {
    width: 100%;
    margin: 7px 0;
    background: #4CAF50;
    color: white;
}

.menu button:hover {
    background: #388E3C;
}

.difficulty {
    display: flex;
    gap: 10px;
}

.difficulty button {
    flex: 1;
    background: #ddd;
}

.difficulty button.active {
    background: #4CAF50;
    color: white;
}

.operation {
    text-align: center;
    font-size: 38px;
    font-weight: bold;
    margin: 25px 0;
}

.answers {
    display: flex;
    gap: 15px;
}

.answer-box {
    flex: 1;
}

.answer-box label {
    display: block;
    text-align: center;
    font-weight: bold;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 14px;
    font-size: 24px;
    text-align: center;
    border: 2px solid #ccc;
    border-radius: 10px;
}

input:focus {
    border-color: #4CAF50;
    outline: none;
}

.validate {
    width: 100%;
    margin-top: 18px;
    background: #2196F3;
    color: white;
}

.next {
    width: 100%;
    margin-top: 10px;
    background: #4CAF50;
    color: white;
    display: none;
}

.result {
    text-align: center;
    font-size: 18px;
    margin-top: 15px;
    min-height: 50px;
}

.correct {
    color: #2E7D32;
    font-weight: bold;
}

.wrong {
    color: #D32F2F;
    font-weight: bold;
}

.progress {
    text-align: center;
    font-size: 18px;
}

.hidden {
    display: none;
}

.stat {
    display: flex;
    justify-content: space-around;
    text-align: center;
    margin: 15px 0;
}

.stat div {
    background: #f1f1f1;
    padding: 12px;
    border-radius: 10px;
    min-width: 100px;
}

.error-item {
    background: #ffebee;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
}

.reset {
    background: #f44336 !important;
    margin-top: 15px;
}

.back {
    background: #777 !important;
    color: white;
    width: 100%;
    margin-top: 10px;
}

@media (max-width: 450px) {
    .operation {
        font-size: 32px;
    }

    .answers {
        gap: 8px;
    }

    input {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<header>
    <h1>➗ Quotient et Reste</h1>
</header>

<div class="container">

    <!-- MENU -->
    <div id="menu" class="card menu">
        <h2>Choisis ton niveau</h2>

        <button onclick="startGame('facile')">
            🟢 Facile<br>
            <small>Quotient à 1 chiffre</small>
        </button>

        <button onclick="startGame('moyen')">
            🟠 Moyen<br>
            <small>Quotient à 2 chiffres</small>
        </button>

        <button onclick="showProgress()">
            📊 Progression
        </button>

        <button onclick="showErrors()">
            ❌ Mes erreurs
        </button>
    </div>


    <!-- JEU -->
    <div id="game" class="card hidden">

        <div class="progress">
            Question <span id="questionNumber">1</span> / 10
            &nbsp; | &nbsp;
            Score : <span id="score">0</span>
        </div>

        <div class="operation">
            <span id="dividend">48</span>
            ÷
            <span id="divisor">6</span>
        </div>

        <div class="answers">

            <div class="answer-box">
                <label>Quotient</label>
                <input
                    type="number"
                    id="quotient"
                    inputmode="numeric"
                    min="0"
                    autocomplete="off">
            </div>

            <div class="answer-box">
                <label>Reste</label>
                <input
                    type="number"
                    id="remainder"
                    inputmode="numeric"
                    min="0"
                    autocomplete="off">
            </div>

        </div>

        <button class="validate" id="validateBtn" onclick="checkAnswer()">
            ✓ Vérifier
        </button>

        <div id="result" class="result"></div>

        <button class="next" id="nextBtn" onclick="nextQuestion()">
            Question suivante →
        </button>

        <button class="back" onclick="backToMenu()">
            ← Menu
        </button>

    </div>


    <!-- FIN -->
    <div id="finish" class="card hidden">

        <h2>🎉 Série terminée !</h2>

        <div class="stat">
            <div>
                <strong id="finalScore">0</strong><br>
                Score
            </div>

            <div>
                <strong id="finalCorrect">0</strong><br>
                Correctes
            </div>
        </div>

        <button class="validate" onclick="restartGame()">
            🔄 Recommencer
        </button>

        <button class="back" onclick="backToMenu()">
            ← Menu
        </button>

    </div>


    <!-- PROGRESSION -->
    <div id="progressPage" class="card hidden">

        <h2>📊 Progression</h2>

        <div class="stat">
            <div>
                <strong id="totalQuestions">0</strong><br>
                Questions
            </div>

            <div>
                <strong id="totalCorrect">0</strong><br>
                Correctes
            </div>
        </div>

        <p style="text-align:center">
            Taux de réussite :
            <strong id="successRate">0%</strong>
        </p>

        <button class="back" onclick="backToMenu()">
            ← Menu
        </button>

        <button class="reset" onclick="resetProgress()">
            🗑 Réinitialiser la progression
        </button>

    </div>


    <!-- ERREURS -->
    <div id="errorsPage" class="card hidden">

        <h2>❌ Mes erreurs</h2>

        <div id="errorsList"></div>

        <button class="back" onclick="backToMenu()">
            ← Menu
        </button>

        <button class="reset" onclick="clearErrors()">
            🗑 Effacer mes erreurs
        </button>

    </div>

</div>


<script>

// ==============================
// VARIABLES
// ==============================

let difficulty = "facile";

let questionNumber = 1;
let score = 0;
let correctAnswers = 0;

let currentDividend;
let currentDivisor;
let currentQuotient;
let currentRemainder;

const totalQuestions = 10;


// ==============================
// STOCKAGE
// ==============================

let errors = JSON.parse(
    localStorage.getItem("divisionErrors") || "[]"
);

let statistics = JSON.parse(
    localStorage.getItem("divisionStatistics") ||
    '{"questions":0,"correct":0}'
);


// ==============================
// AFFICHER UNE PAGE
// ==============================

function hideAll() {

    document.getElementById("menu").classList.add("hidden");
    document.getElementById("game").classList.add("hidden");
    document.getElementById("finish").classList.add("hidden");
    document.getElementById("progressPage").classList.add("hidden");
    document.getElementById("errorsPage").classList.add("hidden");
}


// ==============================
// COMMENCER LE JEU
// ==============================

function startGame(level) {

    difficulty = level;

    questionNumber = 1;
    score = 0;
    correctAnswers = 0;

    hideAll();

    document.getElementById("game").classList.remove("hidden");

    document.getElementById("score").textContent = score;
    document.getElementById("questionNumber").textContent = questionNumber;

    generateQuestion();
}


// ==============================
// GENERER UNE QUESTION
// ==============================

function generateQuestion() {

    let q;

    if (difficulty === "facile") {

        // Quotient de 1 chiffre : 1 à 9
        q = randomInt(1, 9);

    } else {

        // Quotient de 2 chiffres : 10 à 99
        q = randomInt(10, 99);
    }


    // Diviseur de 1 chiffre
    let d = randomInt(2, 9);

    // Reste inférieur au diviseur
    let r = randomInt(0, d - 1);

    let n = q * d + r;


    currentQuotient = q;
    currentDivisor = d;
    currentRemainder = r;
    currentDividend = n;


    document.getElementById("dividend").textContent = n;
    document.getElementById("divisor").textContent = d;


    document.getElementById("quotient").value = "";
    document.getElementById("remainder").value = "";

    document.getElementById("result").innerHTML = "";

    document.getElementById("validateBtn").style.display = "block";
    document.getElementById("nextBtn").style.display = "none";


    document.getElementById("quotient").focus();
}


// ==============================
// NOMBRE ALEATOIRE
// ==============================

function randomInt(min, max) {

    return Math.floor(
        Math.random() * (max - min + 1)
    ) + min;
}


// ==============================
// VERIFIER
// ==============================

function checkAnswer() {

    const q = Number(
        document.getElementById("quotient").value
    );

    const r = Number(
        document.getElementById("remainder").value
    );


    if (
        document.getElementById("quotient").value === "" ||
        document.getElementById("remainder").value === ""
    ) {

        document.getElementById("result").innerHTML =
            '<span class="wrong">⚠️ Écris le quotient et le reste.</span>';

        return;
    }


    let quotientCorrect = q === currentQuotient;
    let remainderCorrect = r === currentRemainder;


    statistics.questions++;


    let message = "";


    // ------------------------------
    // LES DEUX SONT CORRECTS
    // ------------------------------

    if (quotientCorrect && remainderCorrect) {

        score++;
        correctAnswers++;
        statistics.correct++;

        message = `
            <span class="correct">
                ✅ Bravo !<br>
                Quotient correct ✔️<br>
                Reste correct ✔️
            </span>
        `;

    } else {

        // ------------------------------
        // QUOTIENT
        // ------------------------------

        if (quotientCorrect) {

            message += `
                <span class="correct">
                    ✅ Quotient correct : ${currentQuotient}
                </span><br>
            `;

        } else {

            message += `
                <span class="wrong">
                    ❌ Quotient incorrect.<br>
                    Le bon quotient est ${currentQuotient}.
                </span><br>
            `;
        }


        // ------------------------------
        // RESTE
        // ------------------------------

        if (remainderCorrect) {

            message += `
                <span class="correct">
                    ✅ Reste correct : ${currentRemainder}
                </span>
            `;

        } else {

            message += `
                <span class="wrong">
                    ❌ Reste incorrect.<br>
                    Le bon reste est ${currentRemainder}.
                </span>
            `;
        }


        // Sauvegarder l'erreur
        errors.push({
            dividend: currentDividend,
            divisor: currentDivisor,
            userQuotient: q,
            userRemainder: r,
            correctQuotient: currentQuotient,
            correctRemainder: currentRemainder
        });

        localStorage.setItem(
            "divisionErrors",
            JSON.stringify(errors)
        );
    }


    localStorage.setItem(
        "divisionStatistics",
        JSON.stringify(statistics)
    );


    document.getElementById("result").innerHTML = message;

    document.getElementById("score").textContent = score;

    document.getElementById("validateBtn").style.display = "none";
    document.getElementById("nextBtn").style.display = "block";
}


// ==============================
// QUESTION SUIVANTE
// ==============================

function nextQuestion() {

    if (questionNumber >= totalQuestions) {

        finishGame();

        return;
    }


    questionNumber++;

    document.getElementById("questionNumber").textContent =
        questionNumber;

    generateQuestion();
}


// ==============================
// FIN
// ==============================

function finishGame() {

    hideAll();

    document.getElementById("finish").classList.remove("hidden");

    document.getElementById("finalScore").textContent =
        score + " / " + totalQuestions;

    document.getElementById("finalCorrect").textContent =
        correctAnswers;
}


// ==============================
// RECOMMENCER
// ==============================

function restartGame() {

    startGame(difficulty);
}


// ==============================
// MENU
// ==============================

function backToMenu() {

    hideAll();

    document.getElementById("menu").classList.remove("hidden");
}


// ==============================
// PROGRESSION
// ==============================

function showProgress() {

    hideAll();

    document.getElementById("progressPage")
        .classList.remove("hidden");


    document.getElementById("totalQuestions")
        .textContent = statistics.questions;


    document.getElementById("totalCorrect")
        .textContent = statistics.correct;


    let rate = 0;

    if (statistics.questions > 0) {

        rate = Math.round(
            statistics.correct /
            statistics.questions * 100
        );
    }


    document.getElementById("successRate")
        .textContent = rate + "%";
}


// ==============================
// MES ERREURS
// ==============================

function showErrors() {

    hideAll();

    document.getElementById("errorsPage")
        .classList.remove("hidden");


    const list =
        document.getElementById("errorsList");


    if (errors.length === 0) {

        list.innerHTML = `
            <p style="text-align:center">
                🎉 Aucune erreur enregistrée !
            </p>
        `;

        return;
    }


    list.innerHTML = "";


    // Afficher les dernières erreurs
    errors.slice().reverse().forEach(error => {

        list.innerHTML += `
            <div class="error-item">

                <strong>
                    ${error.dividend} ÷ ${error.divisor}
                </strong>

                <br><br>

                Ta réponse :
                q = ${error.userQuotient},
                r = ${error.userRemainder}

                <br>

                Bonne réponse :
                <strong>
                    q = ${error.correctQuotient},
                    r = ${error.correctRemainder}
                </strong>

            </div>
        `;
    });
}


// ==============================
// EFFACER ERREURS
// ==============================

function clearErrors() {

    if (
        confirm("Voulez-vous effacer toutes les erreurs ?")
    ) {

        errors = [];

        localStorage.removeItem("divisionErrors");

        showErrors();
    }
}


// ==============================
// REINITIALISER PROGRESSION
// ==============================

function resetProgress() {

    if (
        confirm("Voulez-vous réinitialiser toute la progression ?")
    ) {

        statistics = {
            questions: 0,
            correct: 0
        };

        errors = [];

        localStorage.removeItem("divisionStatistics");
        localStorage.removeItem("divisionErrors");

        showProgress();
    }
}

</script>

</body>
</html>
