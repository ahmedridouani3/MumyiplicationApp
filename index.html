<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4CAF50">

<title>Jeu du quotient et du reste</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
    min-height: 100vh;
}

.app {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 15px;
    text-align: center;
}

h1 {
    color: #2e7d32;
    font-size: 28px;
    margin: 8px 0;
}

.subtitle {
    font-size: 18px;
    color: #555;
    margin-bottom: 15px;
}

/* MENU */

.menu {
    display: block;
}

.menu button {
    width: 90%;
    max-width: 380px;
    border: none;
    border-radius: 20px;
    padding: 18px;
    margin: 9px auto;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    display: block;
}

.facile {
    background: #4CAF50;
    color: white;
}

.moyen {
    background: #FF9800;
    color: white;
}

.difficile {
    background: #e53935;
    color: white;
}

.progressionBtn {
    background: #2196F3;
    color: white;
}

.erreursBtn {
    background: #9C27B0;
    color: white;
}

/* JEU */

.game {
    display: none;
}

.topbar {
    background: white;
    border-radius: 18px;
    padding: 12px;
    font-size: 19px;
    font-weight: bold;
    box-shadow: 0 3px 10px #ccc;
}

.question-card {
    background: white;
    border-radius: 25px;
    padding: 22px 15px;
    margin-top: 15px;
    box-shadow: 0 5px 15px #ccc;
}

.level {
    font-size: 20px;
    font-weight: bold;
}

.question-number {
    color: #777;
    margin-top: 8px;
}

.division {
    font-size: 45px;
    font-weight: bold;
    color: #1565c0;
    margin: 18px 0;
}

.help {
    background: #fff8e1;
    border-radius: 15px;
    padding: 13px;
    font-size: 18px;
    margin-bottom: 20px;
}

.answers {
    display: flex;
    gap: 12px;
    justify-content: center;
}

.answer-box {
    width: 45%;
}

.answer-box label {
    display: block;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 7px;
}

input {
    width: 100%;
    height: 65px;
    border: 3px solid #90caf9;
    border-radius: 15px;
    font-size: 30px;
    text-align: center;
    outline: none;
}

input:focus {
    border-color: #2196f3;
}

.mainButton,
.backButton {
    width: 90%;
    max-width: 350px;
    border: none;
    border-radius: 18px;
    padding: 16px;
    margin: 12px auto;
    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
    display: block;
}

.check {
    background: #4CAF50;
    color: white;
}

.next {
    background: #2196F3;
    color: white;
    display: none;
}

.backButton {
    background: #757575;
    color: white;
}

.result {
    min-height: 70px;
    margin-top: 15px;
    font-size: 18px;
    line-height: 1.6;
}

.correct {
    color: #2e7d32;
    font-weight: bold;
}

.wrong {
    color: #d32f2f;
    font-weight: bold;
}

.correction {
    background: #f5f5f5;
    border-radius: 15px;
    padding: 12px;
    margin-top: 10px;
}

/* PROGRESSION */

.page {
    display: none;
}

.progressCard {
    background: white;
    border-radius: 20px;
    padding: 18px;
    margin: 12px 0;
    box-shadow: 0 4px 12px #ccc;
}

.progressTitle {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 10px;
}

.progressBar {
    height: 25px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
}

.progressFill {
    height: 100%;
    width: 0%;
    background: #4CAF50;
    transition: width 0.5s;
}

.progressText {
    margin-top: 8px;
    font-size: 18px;
}

/* ERREURS */

.errorCard {
    background: white;
    border-radius: 18px;
    padding: 15px;
    margin: 10px 0;
    text-align: left;
    box-shadow: 0 3px 10px #ccc;
}

.errorDivision {
    font-size: 25px;
    font-weight: bold;
    color: #1565c0;
}

.errorAnswer {
    margin-top: 7px;
    color: #d32f2f;
}

.correctAnswer {
    color: #2e7d32;
}

.noErrors {
    background: white;
    border-radius: 20px;
    padding: 25px;
    font-size: 20px;
}

/* FIN */

.finished {
    display: none;
    background: white;
    border-radius: 25px;
    padding: 30px 15px;
    margin-top: 20px;
    box-shadow: 0 5px 15px #ccc;
}

.finished h2 {
    color: #2e7d32;
    font-size: 30px;
}

.finalScore {
    font-size: 25px;
    font-weight: bold;
}

.stars {
    font-size: 28px;
    margin: 10px;
}

@media (max-width: 380px) {

    h1 {
        font-size: 24px;
    }

    .division {
        font-size: 37px;
    }

    input {
        height: 58px;
        font-size: 27px;
    }

    .answer-box label {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="app">

<h1>🧮 Quotient & Reste</h1>

<div class="subtitle">
Apprends en jouant !
</div>


<!-- ================= MENU ================= -->

<div id="menu" class="menu">

    <button class="facile" onclick="startGame('facile')">
        🟢 Facile
    </button>

    <button class="moyen" onclick="startGame('moyen')">
        🟠 Moyen
    </button>

    <button class="difficile" onclick="startGame('difficile')">
        🔴 Difficile
    </button>

    <button class="progressionBtn" onclick="showProgression()">
        📈 Ma progression
    </button>

    <button class="erreursBtn" onclick="showErrors()">
        ❌ Mes erreurs
    </button>

</div>


<!-- ================= JEU ================= -->

<div id="game" class="game">

    <div class="topbar">

        ⭐ Score :
        <span id="score">0</span> / 10

        <br>

        <span id="levelName"></span>

    </div>

    <div class="question-card">

        <div class="question-number">
            Question <span id="questionNumber">1</span> / 10
        </div>

        <div class="division">

            <span id="dividend">22</span>
            ÷
            <span id="divisor">6</span>

        </div>

        <div class="help">

            💡 Trouve le
            <b>quotient</b>
            et le
            <b>reste</b>.

        </div>

        <div class="answers">

            <div class="answer-box">

                <label>🔢 Quotient</label>

                <input
                    id="quotient"
                    type="number"
                    inputmode="numeric"
                    min="0"
                    placeholder="?"
                >

            </div>


            <div class="answer-box">

                <label>🔵 Reste</label>

                <input
                    id="remainder"
                    type="number"
                    inputmode="numeric"
                    min="0"
                    placeholder="?"
                >

            </div>

        </div>


        <div id="result" class="result"></div>


        <button
            id="check"
            class="mainButton check"
            onclick="checkAnswer()">

            ✅ Vérifier

        </button>


        <button
            id="next"
            class="mainButton next"
            onclick="nextQuestion()">

            👉 Question suivante

        </button>


        <button
            class="backButton"
            onclick="backToMenu()">

            🏠 Menu

        </button>

    </div>

</div>


<!-- ================= FIN ================= -->

<div id="finished" class="finished">

    <h2>🎉 Partie terminée !</h2>

    <div class="finalScore">

        Score :
        <span id="finalScore">0</span> / 10

    </div>

    <div id="finalStars" class="stars"></div>

    <button
        class="mainButton check"
        onclick="restartSameLevel()">

        🔄 Rejouer

    </button>

    <button
        class="backButton"
        onclick="backToMenu()">

        🏠 Menu

    </button>

</div>


<!-- ================= PROGRESSION ================= -->

<div id="progression" class="page">

    <h2>📈 Ma progression</h2>


    <div class="progressCard">

        <div class="progressTitle">
            🟢 Facile
        </div>

        <div class="progressBar">
            <div id="progressFacile"
                 class="progressFill">
            </div>
        </div>

        <div id="textFacile"
             class="progressText">
        </div>

    </div>


    <div class="progressCard">

        <div class="progressTitle">
            🟠 Moyen
        </div>

        <div class="progressBar">
            <div id="progressMoyen"
                 class="progressFill">
            </div>
        </div>

        <div id="textMoyen"
             class="progressText">
        </div>

    </div>


    <div class="progressCard">

        <div class="progressTitle">
            🔴 Difficile
        </div>

        <div class="progressBar">
            <div id="progressDifficile"
                 class="progressFill">
            </div>
        </div>

        <div id="textDifficile"
             class="progressText">
        </div>

    </div>


    <button
        class="backButton"
        onclick="backToMenu()">

        🏠 Retour

    </button>

</div>


<!-- ================= ERREURS ================= -->

<div id="errorsPage" class="page">

    <h2>❌ Mes erreurs</h2>

    <div id="errorsList"></div>


    <button
        id="practiceErrors"
        class="mainButton erreursBtn"
        onclick="practiceErrors()">

        🎯 Refaire mes erreurs

    </button>


    <button
        class="backButton"
        onclick="backToMenu()">

        🏠 Retour

    </button>

</div>


<script>

/* =====================================================
   VARIABLES
===================================================== */

let level = "facile";

let dividend = 22;
let divisor = 6;

let score = 0;
let questionNumber = 1;

let answered = false;

const TOTAL = 10;

let errorMode = false;
let errorQuestions = [];

let errorIndex = 0;


/* =====================================================
   DONNÉES DE PROGRESSION
===================================================== */

let progress = JSON.parse(
    localStorage.getItem("divisionProgress")
) || {

    facile: {
        questions: 0,
        correct: 0
    },

    moyen: {
        questions: 0,
        correct: 0
    },

    difficile: {
        questions: 0,
        correct: 0
    }

};


/* =====================================================
   ERREURS
===================================================== */

let errors = JSON.parse(
    localStorage.getItem("divisionErrors")
) || [];


/* =====================================================
   DÉMARRER UN NIVEAU
===================================================== */

function startGame(selectedLevel) {

    level = selectedLevel;

    errorMode = false;

    score = 0;
    questionNumber = 1;

    document.getElementById("score").textContent = "0";

    document.getElementById("menu").style.display = "none";

    document.getElementById("progression").style.display = "none";

    document.getElementById("errorsPage").style.display = "none";

    document.getElementById("finished").style.display = "none";

    document.getElementById("game").style.display = "block";

    setLevelName();

    newQuestion();
}


/* =====================================================
   NOM DU NIVEAU
===================================================== */

function setLevelName() {

    let name = "";

    if (level === "facile") {
        name = "🟢 Niveau Facile";
    }

    if (level === "moyen") {
        name = "🟠 Niveau Moyen";
    }

    if (level === "difficile") {
        name = "🔴 Niveau Difficile";
    }

    document.getElementById("levelName").textContent = name;
}


/* =====================================================
   GÉNÉRER UNE QUESTION
===================================================== */

function newQuestion() {

    // Si on est dans "Mes erreurs"
    if (errorMode) {
        generateErrorQuestion();
        return;
    }

    if (level === "facile") {

        divisor = Math.floor(Math.random() * 5) + 2;

        // Quotient obligatoirement entre 1 et 9
        dividend = Math.floor(
            Math.random() * (divisor * 9 - divisor + 1)
        ) + divisor;
    }

    else if (level === "moyen") {

        divisor = Math.floor(Math.random() * 8) + 2;

        // Quotient entre 1 et 20
        const quotient =
            Math.floor(Math.random() * 20) + 1;

        const reste =
            Math.floor(Math.random() * divisor);

        dividend =
            divisor * quotient + reste;
    }

    else if (level === "difficile") {

        divisor = Math.floor(Math.random() * 8) + 2;

        // Quotient entre 10 et 50
        const quotient =
            Math.floor(Math.random() * 41) + 10;

        const reste =
            Math.floor(Math.random() * divisor);

        dividend =
            divisor * quotient + reste;
    }

    displayQuestion();
}

/* =====================================================
   QUESTION DANS L'ÉCRAN
===================================================== */

function displayQuestion() {

    document.getElementById("dividend").textContent =
        dividend;

    document.getElementById("divisor").textContent =
        divisor;

    document.getElementById("questionNumber").textContent =
        questionNumber;

    document.getElementById("quotient").value = "";

    document.getElementById("remainder").value = "";

    document.getElementById("result").innerHTML = "";

    document.getElementById("check").style.display =
        "block";

    document.getElementById("next").style.display =
        "none";

    answered = false;

    document.getElementById("quotient").focus();
}


/* =====================================================
   VÉRIFIER
===================================================== */

function checkAnswer() {

    if (answered) return;


    const userQ =
        Number(
            document.getElementById("quotient").value
        );

    const userR =
        Number(
            document.getElementById("remainder").value
        );


    const correctQ =
        Math.floor(dividend / divisor);

    const correctR =
        dividend % divisor;


    const quotientOK =
        userQ === correctQ;

    const remainderOK =
        userR === correctR;


    let html = "";


    /* ----------------------------------
       LES DEUX SONT JUSTES
    ---------------------------------- */

    if (quotientOK && remainderOK) {

        score++;

        html = `
        <div class="correct">
            🎉 BRAVO ! Les deux réponses sont justes !
        </div>

        <div class="correction">
            ${dividend} = ${divisor} ×
            ${correctQ} + ${correctR}
        </div>
        `;
    }


    /* ----------------------------------
       QUOTIENT JUSTE
       RESTE FAUX
    ---------------------------------- */

    else if (quotientOK && !remainderOK) {

        html = `
        <div class="correct">
            ✅ Quotient : BRAVO !
        </div>

        <div class="wrong">
            ❌ Reste : ce n'est pas correct.
        </div>

        <div class="correction">
            Le bon reste est :
            <b>${correctR}</b>
            <br><br>
            ${dividend} = ${divisor} ×
            ${correctQ} + ${correctR}
        </div>
        `;
    }


    /* ----------------------------------
       QUOTIENT FAUX
       RESTE JUSTE
    ---------------------------------- */

    else if (!quotientOK && remainderOK) {

        html = `
        <div class="wrong">
            ❌ Quotient : ce n'est pas correct.
        </div>

        <div class="correct">
            ✅ Reste : BRAVO !
        </div>

        <div class="correction">
            Le bon quotient est :
            <b>${correctQ}</b>
            <br><br>
            ${dividend} = ${divisor} ×
            ${correctQ} + ${correctR}
        </div>
        `;
    }


    /* ----------------------------------
       LES DEUX SONT FAUX
    ---------------------------------- */

    else {

        html = `
        <div class="wrong">
            ❌ Il faut encore travailler les deux.
        </div>

        <div class="correction">
            🔢 Quotient :
            <b>${correctQ}</b>
            <br>

            🔵 Reste :
            <b>${correctR}</b>
            <br><br>

            ${dividend} = ${divisor} ×
            ${correctQ} + ${correctR}
        </div>
        `;
    }


    document.getElementById("result").innerHTML =
        html;


    /* ----------------------------------
       ENREGISTRER LA PROGRESSION
    ---------------------------------- */

    progress[level].questions++;


    if (quotientOK && remainderOK) {

        progress[level].correct++;
    }


    saveProgress();


    /* ----------------------------------
       ENREGISTRER L'ERREUR
    ---------------------------------- */

    if (!quotientOK || !remainderOK) {

        saveError(
            dividend,
            divisor,
            userQ,
            userR,
            correctQ,
            correctR,
            level
        );
    }


    document.getElementById("score").textContent =
        score;


    answered = true;

    document.getElementById("check").style.display =
        "none";


    if (errorMode) {

        if (errorIndex < errorQuestions.length - 1) {

            document.getElementById("next").style.display =
                "block";

        } else {

            setTimeout(showFinal, 800);
        }

    }

    else {

        if (questionNumber < TOTAL) {

            document.getElementById("next").style.display =
                "block";

        } else {

            setTimeout(showFinal, 800);
        }
    }
}


/* =====================================================
   SAUVEGARDER UNE ERREUR
===================================================== */

function saveError(
    div,
    diviseur,
    userQ,
    userR,
    correctQ,
    correctR,
    niveau
) {

    /*
    Évite de multiplier exactement
    la même erreur dans la liste.
    */

    const exists = errors.some(e =>
        e.dividend === div &&
        e.divisor === diviseur
    );


    if (!exists) {

        errors.push({

            dividend: div,

            divisor: diviseur,

            userQ: userQ,

            userR: userR,

            correctQ: correctQ,

            correctR: correctR,

            level: niveau

        });

        localStorage.setItem(
            "divisionErrors",
            JSON.stringify(errors)
        );
    }
}


/* =====================================================
   QUESTION SUIVANTE
===================================================== */

function nextQuestion() {

    // MODE "MES ERREURS"
    if (errorMode) {

        errorIndex++;

        if (errorIndex >= errorQuestions.length) {
            showFinal();
            return;
        }

        dividend =
            errorQuestions[errorIndex].dividend;

        divisor =
            errorQuestions[errorIndex].divisor;

        displayQuestion();

        return;
    }

    // MODE NORMAL
    questionNumber++;

    newQuestion();
}

function generateErrorQuestion() {

    if (errorQuestions.length === 0) {
        showErrors();
        return;
    }

    dividend =
        errorQuestions[errorIndex].dividend;

    divisor =
        errorQuestions[errorIndex].divisor;

    displayQuestion();
}

/* =====================================================
   FIN DE PARTIE
===================================================== */

function showFinal() {

    document.getElementById("game").style.display =
        "none";

    document.getElementById("finished").style.display =
        "block";

    document.getElementById("finalScore").textContent =
        score;


    let stars = "";

    if (score >= 9) {

        stars =
            "⭐⭐⭐⭐⭐<br>🏆 Excellent !";
    }

    else if (score >= 7) {

        stars =
            "⭐⭐⭐⭐<br>🌟 Super !";
    }

    else if (score >= 5) {

        stars =
            "⭐⭐⭐<br>👏 Bravo !";
    }

    else {

        stars =
            "⭐⭐<br>💪 Continue à t'entraîner !";
    }


    document.getElementById("finalStars").innerHTML =
        stars;
}


/* =====================================================
   REJOUER LE MÊME NIVEAU
===================================================== */

function restartSameLevel() {

    document.getElementById("finished").style.display =
        "none";

    startGame(level);
}


/* =====================================================
   PROGRESSION
===================================================== */

function saveProgress() {

    localStorage.setItem(
        "divisionProgress",
        JSON.stringify(progress)
    );
}


function showProgression() {

    document.getElementById("menu").style.display =
        "none";

    document.getElementById("game").style.display =
        "none";

    document.getElementById("errorsPage").style.display =
        "none";

    document.getElementById("finished").style.display =
        "none";

    document.getElementById("progression").style.display =
        "block";


    updateProgress(
        "facile",
        "progressFacile",
        "textFacile"
    );

    updateProgress(
        "moyen",
        "progressMoyen",
        "textMoyen"
    );

    updateProgress(
        "difficile",
        "progressDifficile",
        "textDifficile"
    );
}


function updateProgress(
    niveau,
    barId,
    textId
) {

    const questions =
        progress[niveau].questions;

    const correct =
        progress[niveau].correct;


    let percent = 0;

    if (questions > 0) {

        percent =
            Math.round(
                correct / questions * 100
            );
    }


    document.getElementById(barId).style.width =
        percent + "%";


    document.getElementById(textId).textContent =
        `${percent}% de réussite — ${correct} bonne(s) réponse(s) sur ${questions}`;
}


/* =====================================================
   MES ERREURS
===================================================== */

function showErrors() {

    document.getElementById("menu").style.display =
        "none";

    document.getElementById("game").style.display =
        "none";

    document.getElementById("progression").style.display =
        "none";

    document.getElementById("finished").style.display =
        "none";

    document.getElementById("errorsPage").style.display =
        "block";


    const list =
        document.getElementById("errorsList");


    if (errors.length === 0) {

        list.innerHTML = `
            <div class="noErrors">
                🎉 Bravo !<br><br>
                Tu n'as pas encore d'erreurs à revoir.
            </div>
        `;

        document.getElementById(
            "practiceErrors"
        ).style.display = "none";

        return;
    }


    document.getElementById(
        "practiceErrors"
    ).style.display = "block";


    let html = "";


    errors.forEach((e, index) => {

        html += `

        <div class="errorCard">

            <div class="errorDivision">
                ${e.dividend} ÷ ${e.divisor}
            </div>

            <div class="errorAnswer">

                Ta réponse :
                quotient = ${e.userQ},
                reste = ${e.userR}

            </div>

            <div class="correctAnswer">

                Correction :
                quotient = ${e.correctQ},
                reste = ${e.correctR}

            </div>

        </div>

        `;
    });


    list.innerHTML = html;
}


/* =====================================================
   REFAIRE LES ERREURS
===================================================== */

function practiceErrors() {

    if (errors.length === 0) {

        return;
    }


    errorMode = true;

    errorQuestions =
        [...errors];

    errorIndex = 0;

    score = 0;

    questionNumber = 1;


    dividend =
        errorQuestions[0].dividend;

    divisor =
        errorQuestions[0].divisor;


    document.getElementById("errorsPage").style.display =
        "none";

    document.getElementById("game").style.display =
        "block";

    document.getElementById("finished").style.display =
        "none";

    document.getElementById("score").textContent =
        "0";

    document.getElementById("levelName").textContent =
        "🎯 Révision de mes erreurs";

    displayQuestion();
}


/* =====================================================
   MENU
===================================================== */

function backToMenu() {

    document.getElementById("game").style.display =
        "none";

    document.getElementById("progression").style.display =
        "none";

    document.getElementById("errorsPage").style.display =
        "none";

    document.getElementById("finished").style.display =
        "none";

    document.getElementById("menu").style.display =
        "block";

    errorMode = false;
